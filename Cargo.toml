[workspace]
resolver = "3"
members = ["crates/ateneo", "crates/ateneo-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["James Paul Vizuete Davila <jamespnpm1624@outlook.com>"]
repository = "https://github.com/ateneo-rs/ateneo"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate"] }
thiserror = "2.0"
toml = "1.2"

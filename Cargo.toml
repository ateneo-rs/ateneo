[workspace]
resolver = "3"
members = ["crates/ateneo", "crates/ateneo-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["James Paul Vizuete Davila <jamespnpm1624@outlook.com>"]
repository = "https://github.com/ateneo-rs/ateneo"

[workspace.dependencies]
ateneo-core = { path = "crates/ateneo-core", version = "0.1.0" }
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context", "string"] }
cliclack = "0.5"
console = { version = "0.16", default-features = false }
fluent-templates = "0.15"
iana-time-zone = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sys-locale = "0.3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "json"] }
thiserror = "2.0"
tokio = { version = "1.54", features = ["macros", "rt", "time"] }
toml = "1.2"
toml_edit = "0.25"
